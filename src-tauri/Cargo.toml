[workspace]
members = [
    "crates/anxin-core",
    "crates/anxin-service",
    "crates/anxin-tray",
]
resolver = "2"

[package]
name = "anxin-security"
version = "1.0.0"
description = "AnXin Security - Tauri Application"
authors = ["AnXin Security Team"]
edition = "2021"

[[bin]]
name = "AnXinSecurity"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anxin-core = { path = "crates/anxin-core" }
tauri = { version = "2.0", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
chrono = "0.4"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
