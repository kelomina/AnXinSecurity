[package]
name = "anxin-tray"
version = "1.0.0"
description = "AnXin Security - tray process (tray icon, interception window, exit prompt)"
authors = ["AnXin Security Team"]
edition = "2021"

[[bin]]
name = "AnXinTray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anxin-core = { path = "../anxin-core" }
tauri = { version = "2.0", features = ["tray-icon", "image-ico"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
