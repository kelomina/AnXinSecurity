<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
    <title>AnXin Security</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./interception.css">
  </head>
  <body>
    <div class="ix-surface ix-drag">
      <div class="ix-header ix-drag">
        <div class="ix-title-row">
          <div class="ix-title" id="ix-title"></div>
          <div class="ix-badge" id="ix-severity-badge"></div>
        </div>
        <div class="ix-sub" id="ix-sub"></div>
      </div>

      <div class="ix-body ix-nodrag">
        <div class="ix-main">
          <div class="ix-kv">
            <div class="ix-kv-k" id="ix-k-threat"></div>
            <div class="ix-kv-v" id="ix-v-threat"></div>
          </div>
          <div class="ix-kv">
            <div class="ix-kv-k" id="ix-k-level"></div>
            <div class="ix-kv-v" id="ix-v-level"></div>
          </div>
          <div class="ix-kv">
            <div class="ix-kv-k" id="ix-k-reco"></div>
            <div class="ix-kv-v" id="ix-v-reco"></div>
          </div>
        </div>

        <div class="accordion ix-accordion mt-3" id="ix-accordion">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#ix-details">
                <span id="ix-details-title"></span>
              </button>
            </h2>
            <div id="ix-details" class="accordion-collapse collapse" data-bs-parent="#ix-accordion">
              <div class="accordion-body">
                <div class="small text-muted mb-2" id="ix-details-hint"></div>
                <div class="ix-detail-grid">
                  <div class="ix-detail-item">
                    <div class="ix-detail-label" id="ix-k-pid"></div>
                    <div class="ix-detail-value" id="ix-v-pid"></div>
                  </div>
                  <div class="ix-detail-item">
                    <div class="ix-detail-label" id="ix-k-proc"></div>
                    <div class="ix-detail-value" id="ix-v-proc"></div>
                  </div>
                  <div class="ix-detail-item">
                    <div class="ix-detail-label" id="ix-k-rule"></div>
                    <div class="ix-detail-value" id="ix-v-rule"></div>
                  </div>
                  <div class="ix-detail-item">
                    <div class="ix-detail-label" id="ix-k-signer"></div>
                    <div class="ix-detail-value" id="ix-v-signer"></div>
                  </div>
                </div>
                <pre class="ix-json mt-3" id="ix-json"></pre>
              </div>
            </div>
          </div>
        </div>

        <div class="ix-actions mt-3">
          <button id="ix-btn-allow" type="button" class="btn btn-outline-warning ix-action"></button>
          <button id="ix-btn-block" type="button" class="btn btn-danger ix-action"></button>
        </div>
      </div>
    </div>

    <div class="ix-confirm ix-hidden" id="ix-confirm">
      <div class="ix-confirm-surface">
        <div class="ix-confirm-title" id="ix-confirm-title"></div>
        <div class="ix-confirm-text" id="ix-confirm-text"></div>
        <div class="ix-confirm-actions">
          <button id="ix-confirm-cancel" type="button" class="btn btn-outline-secondary"></button>
          <button id="ix-confirm-ok" type="button" class="btn btn-danger"></button>
        </div>
      </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./interception.js"></script>
  </body>
</html>
